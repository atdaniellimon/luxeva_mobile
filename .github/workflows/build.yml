name: Build Luxeva Native (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar Scaffolding Nativo (iOS & Android)
        run: flutter create . --org com.luxeva --project-name luxeva_mobile --platforms=android,ios

      - name: Descargar Dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Publicar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: luxeva-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build_ios:
    name: Compilar IPA iOS
    runs-on: macos-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar Scaffolding Nativo (iOS & Android)
        run: flutter create . --org com.luxeva --project-name luxeva_mobile --platforms=android,ios

      - name: Descargar Dependencias
        run: flutter pub get

      - name: Compilar iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA para Sideloading (AltStore / Sideloadly / TrollStore)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Luxeva.ipa Payload
          rm -rf Payload

      - name: Publicar Artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: luxeva-ios-ipa
          path: Luxeva.ipa
          if-no-files-found: error
